<div style="font-family:Segoe UI,Arial,sans-serif;max-width:520px;margin:0 auto;color:#17222e">
  <div style="background:#1f4e79;color:#fff;padding:18px 22px;border-radius:8px 8px 0 0">
    <h2 style="margin:0;font-size:18px">Reset your password</h2>
  </div>
  <div style="border:1px solid #dfe4ea;border-top:0;padding:22px;border-radius:0 0 8px 8px">
    <p style="margin-top:0">Hello{% if user.full_name %} {{ user.full_name }}{% endif %},</p>
    <p>Someone asked to reset the password for <strong>{{ user.email }}</strong>.</p>
    <p style="text-align:center;margin:26px 0">
      <a href="{{ protocol }}://{{ domain }}{% url 'accounts:password_reset_confirm' uidb64=uid token=token %}"
         style="background:#1f4e79;color:#fff;padding:11px 22px;border-radius:6px;text-decoration:none;font-weight:600">
        Choose a new password
      </a>
    </p>
    <p style="font-size:13px;color:#4b5a68">
      The link works once and expires in 2 hours. If you did not request this,
      ignore this email - your password stays unchanged.
    </p>
  </div>
</div>
