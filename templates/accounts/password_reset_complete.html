{% extends "base.html" %}
{% block title %}Password changed{% endblock %}
{% block main_class %}auth-shell{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="auth-head">
    <div class="logo">&#10003;</div>
    <h1>Password updated</h1>
    <p>You can now sign in with your new password.</p>
  </div>
  <div class="auth-body">
    <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-block btn-lg">Sign in</a>
  </div>
</div>
{% endblock %}
